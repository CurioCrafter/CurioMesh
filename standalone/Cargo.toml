[package]
name = "curiomesh"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "CurioMesh automatic quad retopology as a standalone program, no Blender needed"
publish = false

[lib]
name = "curiomesh"
path = "src/lib.rs"

[[bin]]
name = "curiomesh"
path = "src/main.rs"

[dependencies]
rayon = "1.12"
pollster = "=0.4.0"
# The native core's geom.rs names `numpy::Complex64`, which is num-complex's type; this alias lets the same file build
# here without Python.
numpy = { package = "num-complex", version = "0.4" }
tobj = "4.0"
gltf = { version = "1.4", default-features = false, features = ["import", "utils", "names"] }
serde_json = "1.0"

# Same graphics stack and pins as native/Cargo.toml.
[target.'cfg(windows)'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }
[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "wgsl"] }
[target.'cfg(not(any(windows, target_vendor = "apple")))'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.release.package."*"]
opt-level = "s"
