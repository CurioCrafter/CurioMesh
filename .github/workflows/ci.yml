name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.2.6 ruff==0.12.10
      - run: ruff check . --select E4,E7,E9,F
      - name: Unit tests (pure Python; test_turbo skips without a native build)
        run: python -m unittest discover -s tests -p "test_*.py" -v

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install numpy==2.2.6
      - name: Build CurioMesh Turbo
        run: cargo build --release --manifest-path native/Cargo.toml
      - name: Equivalence tests against the Python code
        run: |
          mkdir -p _native/linux_x86_64
          cp native/target/release/lib_curiomesh_turbo.so _native/linux_x86_64/_curiomesh_turbo.abi3.so
          python -m unittest tests.test_turbo -v
