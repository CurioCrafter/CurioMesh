name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # rebuild an existing tag with this branch's workflow
    inputs:
      tag:
        description: Existing tag to publish, e.g. v0.7.0
        required: true

permissions:
  contents: read

jobs:
  native:
    # One abi3 (Python >= 3.10) binary per OS/arch serves Blender 3.6 - 5.x.
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            tag: win_amd64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            tag: linux_x86_64
            manylinux: "2_28" # glibc 2.28, the floor of Blender 3.6+ on Linux
          # GitHub retired the Intel macos-13 runner image, so the Intel binary is
          # cross-compiled on Apple Silicon (built, not executed, in CI).
          - os: macos-15
            target: x86_64-apple-darwin
            tag: macos_x86_64
            macos_min: "10.15"
          - os: macos-15
            target: aarch64-apple-darwin
            tag: macos_arm64
            macos_min: "11.0"
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_min }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }} # the tagged source, also when re-run by hand
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: native
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'off' }}
          args: --release --out dist
      - name: Unpack the extension module from the wheel
        shell: bash
        run: |
          python - <<'PY'
          import glob, pathlib, zipfile
          out = pathlib.Path("native-out/${{ matrix.tag }}")
          out.mkdir(parents=True)
          (wheel,) = glob.glob("native/dist/*.whl")
          with zipfile.ZipFile(wheel) as archive:
              names = [n for n in archive.namelist() if n.split("/")[-1].startswith("_curiomesh_turbo")
                       and n.endswith((".pyd", ".so"))]
              assert len(names) == 1, names
              (out / names[0].split("/")[-1]).write_bytes(archive.read(names[0]))
          print(list(out.iterdir()))
          PY
      - name: Equivalence tests on this platform
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          pip install numpy==2.2.6
          mkdir -p _native && cp -r native-out/* _native/
          python -m unittest tests.test_turbo -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.tag }}
          path: native-out
          if-no-files-found: error

  package:
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job publishes the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }} # the tagged source, also when re-run by hand
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          path: native-bin
          merge-multiple: true
      - run: pip install numpy==2.2.6
      - name: Unit tests (with the Linux native build)
        run: |
          cp -r native-bin _native
          python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build all zips with every platform's binary
        run: python scripts/build_release.py --per-version --native-dir native-bin --output dist
      - name: Checksums, so a download can be checked against the release
        run: cd dist && sha256sum *.zip > SHA256SUMS.txt
      - name: Listing zip for extensions.blender.org (Python only, CC0 patterns), kept out of the release
        run: python scripts/build_release.py --blender-listing --output listing
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blender-listing
          path: listing/*.zip
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
